name: Companion checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Install build and test dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test companion and signed updater
        run: python -m unittest discover -s tests -v
      - name: Build native client adapter
        run: tools/companion/Build-Companion.ps1
      - name: Build native dedicated adapter
        run: tools/companion/Build-Companion.ps1 -Dedicated
      - name: Test native guards with synthetic memory
        run: tools/companion/Test-Native.ps1
